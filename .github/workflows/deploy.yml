name: Deploy a GitHub Pages

# Calcula la versión del juego desde el historial de git e inyecta MAYOR.MENOR
# en index.html antes de publicar. La versión NO se almacena en el repo: se
# deriva en CI, así que no hay colisiones entre ordenadores de desarrollo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: necesario para contar commits

      - name: Calcular e inyectar versión
        run: |
          set -e
          # Leer MAYOR y COMMIT_HITO de .version-hito (ignora comentarios).
          MAYOR=$(grep -E '^MAYOR=' .version-hito | cut -d= -f2 | tr -d '[:space:]')
          HITO=$(grep -E '^COMMIT_HITO=' .version-hito | cut -d= -f2 | tr -d '[:space:]')
          # MENOR = commits desde el inicio del hito (inclusive) - 1.
          N=$(git rev-list --count "${HITO}^..HEAD")
          MENOR=$((N - 1))
          VER="${MAYOR}.${MENOR}"
          echo "Versión calculada: $VER"
          # Inyectar en index.html: reemplaza el valor de APP_VERSION sea cual sea
          # (el placeholder 'dev' en local, o un número). Comillas simples dentro.
          perl -0pi -e "s/const APP_VERSION = '[^']*'/const APP_VERSION = '${VER}'/" index.html
          # Verificar que quedó inyectado (falla el build si no, para no publicar mal).
          grep -oE "const APP_VERSION = '${MAYOR}\.${MENOR}'" index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
